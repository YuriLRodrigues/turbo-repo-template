# A Postgres for development:
#   docker compose up -d
#   DATABASE_URL=postgresql://app:app@localhost:5432/app   (in .env)
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep the data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
